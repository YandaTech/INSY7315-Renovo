name: Renovo Full Stack CI/CD

on:
  push:
    branches: [ "main", "adam" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. Backend Testing & Linting
  # ==========================================
  backend-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install flake8 black pytest httpx
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Code formatting check (black)
        run: |
          black --check .

      - name: Code linting (flake8)
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest suite
        env:
          SECRET_KEY: test-ci-secret-key-at-least-32-chars-long!
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          ENABLE_RATE_LIMITING: "true"
          ENVIRONMENT: "development"
        run: |
          python -m pytest -v

  # ==========================================
  # 2. Frontend Lint & Build
  # ==========================================
  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Build frontend distribution
        run: |
          npm run build

  # ==========================================
  # 3. Docker Compose Build Verification
  # ==========================================
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration & Build Images
        env:
          SECRET_KEY: test-ci-secret-key-at-least-32-chars-long!
        run: |
          docker compose build --parallel