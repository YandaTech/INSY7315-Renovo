name: Renovo Full Stack CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. Backend Testing & Linting
  # ==========================================
  backend-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest

    # Production runs PostgreSQL; the migration and copy tests run against it
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install flake8 black pytest httpx
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Code formatting check (black)
        run: |
          black --check .

      - name: Code linting (flake8)
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest suite
        env:
          SECRET_KEY: test-ci-secret-key-at-least-32-chars-long!
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          ENABLE_RATE_LIMITING: "true"
          ENVIRONMENT: "development"
          TEST_POSTGRES_URL: postgresql://postgres:ci-test-only@localhost:5432/postgres
        run: |
          python -m pytest -v

  # ==========================================
  # 2. Frontend Lint & Build
  # ==========================================
  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint frontend (eslint)
        run: |
          npm run lint

      - name: Run frontend unit tests (vitest)
        run: |
          npm test

      - name: Build frontend distribution
        run: |
          npm run build

  # ==========================================
  # 3. Pricing Server (MCP) Tests
  # ==========================================
  pricing-test:
    name: Pricing Server Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mcp-pricing-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mcp-pricing-server/pyproject.toml

      - name: Install dependencies
        # Same approach as the Dockerfile: the service is flat scripts, so
        # install the dependency list from pyproject.toml, not the package.
        run: |
          python -m pip install --upgrade pip
          python -c "import tomllib; print('\\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > requirements.txt
          python -m pip install pytest -r requirements.txt

      - name: Run Pytest suite
        run: |
          python -m pytest -v tests

  # ==========================================
  # 4. Voice Bridge Tests
  # ==========================================
  voice-bridge-test:
    name: Voice Bridge Node Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./voice-bridge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        # Matches voice-bridge/Dockerfile (node:22-alpine).
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: voice-bridge/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run node --test suite
        run: |
          npm test

  # ==========================================
  # 5. AI Agent Tests
  # ==========================================
  ai-agent-check:
    name: AI Agent Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ai-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-agent/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -c "import tomllib; print('\\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > requirements.txt
          python -m pip install -r requirements.txt pytest

      - name: Compile and import the agent
        # Catches syntax errors and missing imports. No API key is needed to
        # import; the client only uses it per request.
        run: |
          python -m compileall -q .
          python -c "import agent"

      - name: Run Pytest suite
        run: |
          python -m pytest -q tests

  # ==========================================
  # 6. Docker Compose Build Verification
  # ==========================================
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, pricing-test, voice-bridge-test, ai-agent-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env from example
        # docker-compose.yml lists ./.env as an env_file and compose refuses
        # to load without it. .env is gitignored, so use the committed example.
        run: |
          cp .env.example .env

      - name: Validate Docker Compose Configuration & Build Images
        env:
          SECRET_KEY: test-ci-secret-key-at-least-32-chars-long!
        run: |
          docker compose build --parallel

  # ==========================================
  # 7. End-to-end browser tests (Playwright)
  # ==========================================
  # Builds the production images (nginx frontend, uvicorn backend,
  # PostgreSQL, pricing server) from docker-compose.e2e.yml and drives the
  # dashboard in Chromium through the main user journeys. See e2e/tests.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Write a throwaway env file
        # CI-only values. Nothing here is a real secret and nothing reaches
        # Twilio, SMS or email: the stack has no voice-bridge or ai-agent.
        run: |
          printf '%s\n' \
            'SECRET_KEY=e2e-ci-only-secret-key-not-used-anywhere-else' \
            'SERVICE_API_KEY=e2e-ci-service-key' > .env.e2e

      - name: Build and start the stack
        # --wait returns once every service passes its healthcheck
        # (frontend: nginx answering /api/health through to the backend)
        run: |
          docker compose -f docker-compose.e2e.yml up --build -d --wait --wait-timeout 300

      - name: Install Playwright and Chromium
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type check the tests
        working-directory: ./e2e
        run: |
          npx tsc --noEmit

      - name: Run Playwright tests
        working-directory: ./e2e
        run: |
          npx playwright test

      - name: Container logs
        if: ${{ failure() }}
        run: |
          docker compose -f docker-compose.e2e.yml logs --no-color > e2e/compose-logs.txt
          tail -n 200 e2e/compose-logs.txt

      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/compose-logs.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the stack
        if: ${{ always() }}
        run: |
          docker compose -f docker-compose.e2e.yml down -v

  # ==========================================
  # 8. Dependency Security Scans
  # ==========================================
  security-scan:
    name: Dependency Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install pip-audit==2.10.1

      # npm audit reads package-lock.json only, so no npm ci is needed.
      # It audits dev dependencies too (no --omit=dev): the build tooling
      # runs in CI and on developer machines. Fails on high or critical.
      # Later steps use !cancelled() so one failure still reports the rest.
      - name: npm audit (frontend)
        working-directory: ./frontend
        run: |
          npm audit --audit-level=high

      - name: npm audit (voice-bridge)
        if: ${{ !cancelled() }}
        working-directory: ./voice-bridge
        run: |
          npm audit --audit-level=high

      - name: npm audit (e2e)
        if: ${{ !cancelled() }}
        working-directory: ./e2e
        run: |
          npm audit --audit-level=high

      # pip-audit has no severity filter: it fails on ANY known
      # vulnerability, not only high ones. The requirements files are full
      # == locks, so --no-deps skips resolution and --disable-pip audits
      # the pins as written without installing anything.
      - name: pip-audit (backend)
        if: ${{ !cancelled() }}
        run: |
          pip-audit --disable-pip --no-deps -r backend/requirements.txt

      - name: pip-audit (mcp-pricing-server)
        if: ${{ !cancelled() }}
        run: |
          pip-audit --disable-pip --no-deps -r mcp-pricing-server/requirements.txt

      - name: pip-audit (ai-agent)
        if: ${{ !cancelled() }}
        run: |
          pip-audit --disable-pip --no-deps -r ai-agent/requirements.txt
