name: Renovo Full Stack CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. Backend Testing & Linting
  # ==========================================
  backend-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install flake8 black pytest httpx
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Code formatting check (black)
        run: |
          black --check .

      - name: Code linting (flake8)
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest suite
        env:
          SECRET_KEY: test-ci-secret-key-at-least-32-chars-long!
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          ENABLE_RATE_LIMITING: "true"
          ENVIRONMENT: "development"
        run: |
          python -m pytest -v

  # ==========================================
  # 2. Frontend Lint & Build
  # ==========================================
  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint frontend (eslint)
        run: |
          npm run lint

      - name: Build frontend distribution
        run: |
          npm run build

  # ==========================================
  # 3. Pricing Server (MCP) Tests
  # ==========================================
  pricing-test:
    name: Pricing Server Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mcp-pricing-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mcp-pricing-server/pyproject.toml

      - name: Install dependencies
        # Same approach as the Dockerfile: the service is flat scripts, so
        # install the dependency list from pyproject.toml, not the package.
        run: |
          python -m pip install --upgrade pip
          python -c "import tomllib; print('\\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > requirements.txt
          python -m pip install pytest -r requirements.txt

      - name: Run Pytest suite
        run: |
          python -m pytest -v tests

  # ==========================================
  # 4. Voice Bridge Tests
  # ==========================================
  voice-bridge-test:
    name: Voice Bridge Node Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./voice-bridge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        # Matches voice-bridge/Dockerfile (node:22-alpine).
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: voice-bridge/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run node --test suite
        run: |
          npm test

  # ==========================================
  # 5. AI Agent Import Check
  # ==========================================
  ai-agent-check:
    name: AI Agent Import Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ai-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-agent/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -c "import tomllib; print('\\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > requirements.txt
          python -m pip install -r requirements.txt

      - name: Compile and import the agent
        # No test suite yet: this catches syntax errors and missing imports.
        # No API key is needed to import; the client only uses it per request.
        run: |
          python -m compileall -q .
          python -c "import agent"

  # ==========================================
  # 6. Docker Compose Build Verification
  # ==========================================
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, pricing-test, voice-bridge-test, ai-agent-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env from example
        # docker-compose.yml lists ./.env as an env_file and compose refuses
        # to load without it. .env is gitignored, so use the committed example.
        run: |
          cp .env.example .env

      - name: Validate Docker Compose Configuration & Build Images
        env:
          SECRET_KEY: test-ci-secret-key-at-least-32-chars-long!
        run: |
          docker compose build --parallel