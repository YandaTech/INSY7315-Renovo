# Production: optimized builds, single entrypoint on :80 (nginx proxies
# /api to the backend), sqlite data persisted in a named volume.
# Run: docker compose -f docker-compose.prod.yml up --build
services:
  backend:
    build:
      context: ./backend
      target: production
    env_file:
      - ./.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/renovo.db
    volumes:
      - backend_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
