# Production: Caddy is the only public entrypoint (80/443) and terminates
# HTTPS for APP_DOMAIN (dashboard) and VOICE_DOMAIN (Twilio). SQLite data,
# pricing edits and certificates persist in named volumes.
# Setup: deploy/README.md. Run: docker compose -f docker-compose.prod.yml up --build -d

# Every container's logs rotate at 10 MB, keeping 3 files (30 MB each), so
# old logs are dropped instead of filling the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
      target: prod
    env_file:
      - ./.env
    environment:
      # Hides /docs, /redoc and /openapi.json and marks the auth cookie Secure
      ENVIRONMENT: production
      DATABASE_URL: sqlite:////data/renovo.db
      PRICING_SERVER_URL: http://mcp-pricing-server:8001/mcp/pricing
    volumes:
      - backend_data:/data
    depends_on:
      - mcp-pricing-server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  mcp-pricing-server:
    build: ./mcp-pricing-server
    volumes:
      # Keeps price edits from the dashboard across rebuilds; seeded from
      # the image's config/pricing_rules.json on first run
      - pricing_config:/app/config
    restart: unless-stopped
    logging: *default-logging

  ai-agent:
    build: ./ai-agent
    env_file:
      - ./.env
    environment:
      PRICING_SERVER_URL: http://mcp-pricing-server:8001/mcp/pricing
    depends_on:
      - mcp-pricing-server
    restart: unless-stopped
    logging: *default-logging

  voice-bridge:
    build: ./voice-bridge
    env_file:
      - ./.env
    environment:
      ENVIRONMENT: production
      PORT: 5000
      BACKEND_API_URL: http://backend:8000
      AI_AGENT_URL: http://ai-agent:8002
      PUBLIC_VOICE_URL: https://${VOICE_DOMAIN}
      CONVERSATION_RELAY_WS_URL: wss://${VOICE_DOMAIN}/
    depends_on:
      backend:
        condition: service_healthy
      ai-agent:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      target: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      VOICE_DOMAIN: ${VOICE_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - voice-bridge
    restart: unless-stopped
    logging: *default-logging

volumes:
  backend_data:
  pricing_config:
  caddy_data:
  caddy_config:
