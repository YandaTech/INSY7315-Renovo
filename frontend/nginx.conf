server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. Looking the backend up per request (via the variable
    # below) means a recreated backend container with a new IP doesn't
    # leave nginx proxying to the old one with 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api/leads/ -> http://backend:8000/leads/
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Client-side routes (/dashboard, /log-call, ...) all serve the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
