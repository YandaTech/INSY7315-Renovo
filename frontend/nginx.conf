server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # No nginx version in the Server header or on error pages
    server_tokens off;

    # Compress text responses. In production Caddy compresses too; this
    # covers the container on its own (local runs and the E2E stack).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Docker's DNS. Looking the backend up per request (via the variable
    # below) means a recreated backend container with a new IP doesn't
    # leave nginx proxying to the old one with 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api/leads/ -> http://backend:8000/leads/
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite puts a content hash in every file name under /assets, so a
    # changed file gets a new name and the old one can be cached for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images in public/ keep their names: cache for a day
    location ~* \.(png|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Client-side routes (/dashboard, /log-call, ...) all serve the SPA.
    # index.html is always revalidated so a deploy shows up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
